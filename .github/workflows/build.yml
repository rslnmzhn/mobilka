name: Build Flutter Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed release artifacts.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APPIMAGE_BUILDER_VERSION: "1.0.3"
  WIX_TOOLSET_VERSION: "5.0.2"
  FLUTTER_VERSION: "3.38.7"
  OPENSSL_VERSION: "3.0.13"
  ANDROID_SIGNER_SHA256: "4A:76:9B:92:8D:47:82:77:30:E3:C5:E1:5A:E3:86:5C:D8:B8:99:93:13:A3:E5:79:BA:A9:B7:34:56:46:55:CD"
  WINDOWS_SIGNER_SHA256: "84EFAEE8B51EF463E312FC90D8B86613739961F11B0C6582B472BB3845D21BA4"

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test

  # workflow_dispatch shares the same stable release resolver as push-to-main.
  resolve_release:
    name: Resolve stable release version
    runs-on: ubuntu-latest
    needs: quality
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: resolve
        shell: bash
        run: bash .github/scripts/resolve_release_version.sh --github-output "${GITHUB_OUTPUT}"

  build_android_ci:
    name: Build Android APK (CI)
    runs-on: ubuntu-latest
    needs:
      - quality
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release != true)
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK (debug, CI validation)
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64

  build_android_release:
    name: Build Android APK (release)
    runs-on: ubuntu-latest
    needs:
      - quality
      - resolve_release
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.release_version }}
      RELEASE_VERSION_CODE: ${{ needs.resolve_release.outputs.android_version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Apply release version
        shell: bash
        run: |
          bash .github/scripts/apply_release_version.sh \
            --version "${RELEASE_VERSION}" \
            --version-code "${RELEASE_VERSION_CODE}"
      - name: Flutter pub get
        run: flutter pub get
      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::Android release signing secrets are required. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
      - name: Build APKs (release, split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define=MOBILKA_VERSION=${RELEASE_VERSION}
      - name: Verify Android signer identity
        shell: bash
        run: |
          bash .github/scripts/verify_android_release.sh \
            com.rslnmzhn.mobilka "${RELEASE_VERSION_CODE}" \
            build/app/outputs/flutter-apk/app-*-release.apk
      - name: Remove temporary Android signing files
        if: always()
        shell: bash
        run: rm -f android/release-keystore.jks android/key.properties
      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk-release-split
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  build_linux:
    name: Build Linux bundle and AppImage
    runs-on: ubuntu-22.04
    needs:
      - quality
      - resolve_release
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.release_version }}
      RELEASE_VERSION_CODE: ${{ needs.resolve_release.outputs.android_version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Linux build and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            clang \
            cmake \
            coreutils \
            desktop-file-utils \
            fakeroot \
            fuse \
            libgdk-pixbuf2.0-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            ninja-build \
            patchelf \
            pkg-config \
            python3-pip \
            python3-setuptools \
            squashfs-tools \
            strace \
            util-linux \
            zsync
      - name: Verify Linux native dependencies
        run: |
          dpkg -s libsecret-1-dev >/dev/null
          ldconfig -p | grep -E 'libsecret-1'
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Apply release version
        shell: bash
        run: |
          bash .github/scripts/apply_release_version.sh \
            --version "${RELEASE_VERSION}" \
            --version-code "${RELEASE_VERSION_CODE}"
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Linux (release)
        run: CXXFLAGS="-Wno-error=unused-but-set-variable" flutter build linux --release -v --dart-define=MOBILKA_VERSION=${RELEASE_VERSION}
      - name: Run Linux native tests
        run: ctest --test-dir build/linux/x64/release -C Release --output-on-failure
      - name: Upload Linux bundle CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundle-release
          path: build/linux/x64/release/bundle
          if-no-files-found: error
      - name: Install pinned appimage-builder
        shell: bash
        run: |
          python3 -m pip install --user "appimage-builder==${APPIMAGE_BUILDER_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Validate appimage-builder availability
        shell: bash
        run: appimage-builder --version
      - name: Package Linux AppImage
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve_release.outputs.release_version }}
        run: bash .github/scripts/package_linux_appimage.sh
      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage-release
          path: mobilka-v${{ needs.resolve_release.outputs.release_version }}-linux-x86_64.AppImage
          if-no-files-found: error

  build_windows:
    name: Build Windows bundle
    runs-on: windows-latest
    needs:
      - quality
      - resolve_release
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.release_version }}
      RELEASE_VERSION_CODE: ${{ needs.resolve_release.outputs.android_version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Apply release version
        shell: bash
        run: |
          bash .github/scripts/apply_release_version.sh \
            --version "${RELEASE_VERSION}" \
            --version-code "${RELEASE_VERSION_CODE}"
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release --dart-define=MOBILKA_VERSION=${env:RELEASE_VERSION}
      - name: Install pinned WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix --version "${env:WIX_TOOLSET_VERSION}"
      - name: Package Windows MSI
        shell: pwsh
        run: >-
          .github/scripts/package_windows_msi.ps1
          -Version "${env:RELEASE_VERSION}"
      - name: Sign and verify Windows MSI
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mobilka-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $certificatePassword = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $pfxData = Get-PfxData -FilePath $certificatePath `
            -Password $certificatePassword
          $sha256 = [Security.Cryptography.HashAlgorithmName]::SHA256
          $certificate = $pfxData.EndEntityCertificates[0]
          $certificateFingerprint = $certificate.GetCertHashString($sha256).ToUpperInvariant()
          if ($certificateFingerprint -ne $env:WINDOWS_SIGNER_SHA256) {
            throw "Windows signing certificate fingerprint mismatch: $certificateFingerprint"
          }
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'mobilka-signing.cer'
          Export-Certificate -Cert $certificate `
            -FilePath $publicCertificatePath | Out-Null
          Write-Host 'Importing release certificate into the runner trust store.'
          # Importing into the user Root store blocks on an interactive
          # confirmation dialog in CI; the LocalMachine stores are writable
          # non-interactively because the runner is elevated.
          $importedRoot = Import-Certificate -FilePath $publicCertificatePath `
            -CertStoreLocation Cert:\LocalMachine\Root
          if (-not $importedRoot) { throw 'Release certificate Root import failed.' }
          $importedTrustedPeople = Import-Certificate -FilePath $publicCertificatePath `
            -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          if (-not $importedTrustedPeople) {
            throw 'Release certificate TrustedPeople import failed.'
          }
          Write-Host 'Locating SignTool.'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          $msi = "build/windows/x64/installer/mobilka-v${env:RELEASE_VERSION}-windows-x64.msi"
          Write-Host 'Signing Windows MSI.'
          & $signtool sign /fd SHA256 `
            /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed.' }
          Write-Host 'Verifying Windows MSI signature.'
          & $signtool verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signature verification failed.' }
          $signature = Get-AuthenticodeSignature -FilePath $msi
          if (-not $signature.SignerCertificate -or $signature.Status -ne 'Valid') {
            throw "MSI Authenticode signature status is $($signature.Status)."
          }
          $actualFingerprint = $signature.SignerCertificate.GetCertHashString($sha256).ToUpperInvariant()
          if ($actualFingerprint -ne $env:WINDOWS_SIGNER_SHA256) {
            throw "MSI signer certificate fingerprint mismatch: $actualFingerprint"
          }
      - name: Remove temporary Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha256 = [Security.Cryptography.HashAlgorithmName]::SHA256
          foreach ($store in 'Root', 'TrustedPeople') {
            $trustedCertificates = @(
              Get-ChildItem "Cert:\LocalMachine\$store" | Where-Object {
                $_.GetCertHashString($sha256) -eq $env:WINDOWS_SIGNER_SHA256
              }
            )
            $trustedCertificates | Remove-Item -Force
            $remainingCertificates = @(
              Get-ChildItem "Cert:\LocalMachine\$store" | Where-Object {
                $_.GetCertHashString($sha256) -eq $env:WINDOWS_SIGNER_SHA256
              }
            )
            if ($remainingCertificates.Count -ne 0) {
              throw "Release certificate ${store} trust cleanup failed."
            }
          }
          Remove-Item -LiteralPath `
            (Join-Path $env:RUNNER_TEMP 'mobilka-signing.pfx'), `
            (Join-Path $env:RUNNER_TEMP 'mobilka-signing.cer') `
            -Force -ErrorAction SilentlyContinue
      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-bundle-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error
      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msi-release
          path: build/windows/x64/installer/mobilka-v${{ needs.resolve_release.outputs.release_version }}-windows-x64.msi
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-24.04
    needs:
      - build_android_release
      - build_linux
      - build_windows
      - resolve_release
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release_assets
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_release.outputs.release_version }}"
          WINDOWS_ROOT_DIR="mobilka-v${VERSION}-windows-x64"
          LINUX_ROOT_DIR="mobilka-v${VERSION}-linux-x64"
          cp "release_assets/android-apk-release-split/app-armeabi-v7a-release.apk" \
            "release_assets/mobilka-v${VERSION}-android-armeabi-v7a.apk"
          cp "release_assets/android-apk-release-split/app-arm64-v8a-release.apk" \
            "release_assets/mobilka-v${VERSION}-android-arm64-v8a.apk"
          cp "release_assets/android-apk-release-split/app-x86_64-release.apk" \
            "release_assets/mobilka-v${VERSION}-android-x86_64.apk"
          cp "release_assets/linux-appimage-release/mobilka-v${VERSION}-linux-x86_64.AppImage" \
            "release_assets/mobilka-v${VERSION}-linux-x86_64.AppImage"
          cp "release_assets/windows-msi-release/mobilka-v${VERSION}-windows-x64.msi" \
            "release_assets/mobilka-v${VERSION}-windows-x64.msi"
          rm -rf "release_assets/${LINUX_ROOT_DIR}" \
            "release_assets/mobilka-v${VERSION}-linux-x64.zip"
          mkdir -p "release_assets/${LINUX_ROOT_DIR}"
          cp -R "release_assets/linux-bundle-release/." \
            "release_assets/${LINUX_ROOT_DIR}/"
          (
            cd "release_assets"
            zip -r "mobilka-v${VERSION}-linux-x64.zip" "${LINUX_ROOT_DIR}"
          )
          rm -rf "release_assets/${WINDOWS_ROOT_DIR}" \
            "release_assets/mobilka-v${VERSION}-windows-x64.zip"
          mkdir -p "release_assets/${WINDOWS_ROOT_DIR}"
          cp -R "release_assets/windows-bundle-release/." \
            "release_assets/${WINDOWS_ROOT_DIR}/"
          (
            cd "release_assets"
            zip -r "mobilka-v${VERSION}-windows-x64.zip" "${WINDOWS_ROOT_DIR}"
          )
      - name: Generate and sign exact release manifest
        shell: bash
        env:
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
          EXPECTED_OPENSSL_VERSION: ${{ env.OPENSSL_VERSION }}
          EXPECTED_PUBLIC_KEY_BASE64: nH/Hnmn7UJtCy4Qb91c9dIAwQ3LSUkv6yRhDhMlZ3JY=
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/generate_release_manifest.sh" \
            --assets-dir "release_assets" \
            --version "${{ needs.resolve_release.outputs.release_version }}" \
            --tag "${{ needs.resolve_release.outputs.release_tag }}" \
            --repository "${{ github.repository }}" \
            --android-version-code "${{ needs.resolve_release.outputs.android_version_code }}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/sign_release_manifest.sh" \
            "release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-release-manifest.json"
      - name: Remove temporary manifest signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}"/mobilka-manifest-key.* "${RUNNER_TEMP}"/mobilka-manifest-public.*
      - name: Create stable release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve_release.outputs.release_tag }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Stable tag ${TAG} already exists." >&2; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "Release ${TAG}"
          git push origin "${TAG}"
      - name: Generate release changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve_release.outputs.release_tag }}"

          git fetch --tags --force
          if PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null)"; then
            git log "${PREVIOUS_TAG}..HEAD" --oneline --no-merges > release_body.md
          else
            git log HEAD --oneline --no-merges > release_body.md
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ needs.resolve_release.outputs.release_tag }}
          tag_name: ${{ needs.resolve_release.outputs.release_tag }}
          prerelease: false
          body_path: release_body.md
          files: |
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-android-armeabi-v7a.apk
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-android-arm64-v8a.apk
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-android-x86_64.apk
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-linux-x64.zip
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-windows-x64.zip
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-windows-x64.msi
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-linux-x86_64.AppImage
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-release-manifest.json
            release_assets/mobilka-v${{ needs.resolve_release.outputs.release_version }}-release-manifest.sig
